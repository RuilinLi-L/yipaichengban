<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ee" />
    <title>智存 - 碎片信息 AI 全能管家</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="device" aria-label="智存应用原型">
        <header class="app-header">
          <div>
            <p class="kicker">vivo 端侧 AI 原型</p>
            <h1>智存</h1>
          </div>
          <button class="round-button" type="button" data-route="tech" aria-label="查看技术路线">i</button>
        </header>

        <section id="app" class="viewport" aria-live="polite"></section>

        <nav class="bottom-nav" aria-label="底部导航">
          <button type="button" data-route="home" class="nav-item is-active">首页</button>
          <button type="button" data-route="vault" class="nav-item">金库</button>
          <button type="button" data-route="search" class="nav-item">搜索</button>
        </nav>

        <button id="floatBall" class="float-ball" type="button" hidden aria-label="悬浮球，长按捕获，双击搜索">
          <span></span>
        </button>
        <p id="toast" class="toast" role="status" hidden></p>
      </section>
    </main>

    <input id="fileInput" class="visually-hidden" type="file" accept="image/*" />
    <script src="./app.js" defer></script>
  </body>
</html>
